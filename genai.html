---
layout: default
title: GenAI Trends
permalink: /genai/
---

<div class="container mt-5">
  <h1 class="mb-4">GenAI Trends Analysis</h1>
  
  <div class="row mb-4">
    <div class="col-md-6">
      <div class="form-group">
        <label for="companySelect">Select Company:</label>
        <select class="form-control" id="companySelect">
          <option value="all">All Companies</option>
          <!-- Companies will be dynamically added here -->
        </select>
      </div>
    </div>
    <div class="col-md-6">
      <div class="form-group">
        <label for="metricSelect">Select Metric:</label>
        <select class="form-control" id="metricSelect">
          <option value="GenAI_Exposure">GenAI Exposure</option>
          <option value="GenAI_Risk">GenAI Risk</option>
          <option value="GenAI_Adoption">GenAI Adoption</option>
          <option value="GenAI_Opportunity">GenAI Opportunity</option>
        </select>
      </div>
    </div>
  </div>
  
  <div class="card mb-4">
    <div class="card-body">
      <canvas id="trendsChart"></canvas>
    </div>
  </div>
  
  <div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="sr-only">Loading...</span>
    </div>
    <p class="mt-2">Loading data...</p>
  </div>
  
  <div id="error-message" class="alert alert-danger" style="display: none;"></div>
</div>

<!-- External libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4"></script>

<!-- Custom resources -->
<script src="{{ '/assets/js/genai.js' | relative_url }}"></script>
