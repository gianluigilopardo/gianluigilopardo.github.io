<div class="genai-container">
  <h1>GenAI Trends Analysis</h1>
  
  <div class="chart-controls">
    <div class="control-group">
      <label for="metric-select">Metric:</label>
      <select id="metric-select">
        <option value="GenAI_Exposure">GenAI Exposure</option>
        <option value="GenAI_Risk">GenAI Risk</option>
        <option value="GenAI_Adoption">GenAI Adoption</option>
        <option value="GenAI_Opportunity">GenAI Opportunity</option>
      </select>
    </div>
    
    <div class="control-group">
      <label for="filter-select">Filter:</label>
      <select id="filter-select">
        <option value="all">All Companies</option>
        <option value="sector">By Sector</option>
        <option value="industry">By Industry</option>
      </select>
    </div>
  </div>
  
  <div id="chart-container" class="chart-container"></div>
  <div id="loading" class="loading-indicator">Loading data...</div>
  <div id="error-message" class="error-text"></div>
  
  <div class="trend-info">
    <h3>About This Visualization</h3>
    <p>This chart displays GenAI metrics across companies and time periods. Select different metrics and filters to explore the data.</p>
  </div>
</div>
