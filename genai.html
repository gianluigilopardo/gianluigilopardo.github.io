---
layout: default
title: GenAI Trends
---

<div class="genai-container">
  <h1>GenAI Trends Analysis</h1>
  
  <div class="chart-controls">
    <select id="chart-type">
      <option value="line">Line Chart</option>
      <option value="bar">Bar Chart</option>
    </select>
    <select id="data-period">
      <option value="all">All Time</option>
      <option value="year">Past Year</option>
      <option value="month">Past Month</option>
    </select>
  </div>
  
  <div id="chart-container"></div>
  <div id="loading">Loading data...</div>
  <div id="error-message" class="error-text"></div>
  
  <div class="trend-info">
    <p>This visualization shows GenAI trends based on various metrics over time.</p>
  </div>
</div>

<!-- External libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.js"></script>

<!-- Custom resources -->
<script src="{{ '/assets/js/genai.js' | relative_url }}"></script>
